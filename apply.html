<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Apply | TNR HR Business Solutions</title><meta name="robots" content="noindex"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"></head><body>
<header class="bg-[#080b10] text-white"><div class="editorial-container py-5 flex justify-between items-center"><a href="index.html"><img src="https://storage.readdy-site.link/project_files/dfa9ab34-723c-4faf-958f-62921ec1b24e/14e8aa28-81b4-4c25-9661-837e119dd1ba_compressed_TNR_Logo_FullColour_Transparent.webp" class="h-12 brightness-0 invert"></a><a href="careers.html" class="text-xs uppercase tracking-wider">Back to Careers</a></div></header>
<main class="max-w-3xl mx-auto px-5 py-14"><div id="job" class="mb-8"><div class="animate-pulse bg-black/5 h-24"></div></div><form id="form" class="bg-white/70 border border-black/5 p-6 md:p-10 space-y-5"><h2 class="text-2xl text-black">Submit Application</h2><p class="text-sm text-black/50">Your CV is stored privately and is accessible only to authorised recruitment staff.</p><div><label class="block text-xs uppercase tracking-wider mb-2">Full Name *</label><input name="full_name" required class="w-full border px-4 py-3"></div><div class="grid md:grid-cols-2 gap-4"><div><label class="block text-xs uppercase tracking-wider mb-2">Email *</label><input name="email" type="email" required class="w-full border px-4 py-3"></div><div><label class="block text-xs uppercase tracking-wider mb-2">Phone</label><input name="phone" class="w-full border px-4 py-3"></div></div><div><label class="block text-xs uppercase tracking-wider mb-2">Cover Letter</label><textarea name="cover_letter" rows="6" class="w-full border px-4 py-3"></textarea></div><div><label class="block text-xs uppercase tracking-wider mb-2">CV (PDF, DOC or DOCX, max 10MB)</label><input name="cv" type="file" accept=".pdf,.doc,.docx" class="w-full border px-4 py-3 bg-white"></div><div id="msg" class="hidden p-3 text-sm"></div><button id="submit" class="bg-[#111827] text-white px-7 py-4 text-xs uppercase tracking-wider">Submit Application</button></form></main>
<script>
const URL='https://eugqokfxwucusniamxvm.supabase.co',KEY='sb_publishable_8p9-6czzRXPx5rS2BwiZGg_QGz3RWeM',client=supabase.createClient(URL,KEY),END='https://eugqokfxwucusniamxvm.supabase.co/functions/v1/submit-application';const id=Number(new URLSearchParams(location.search).get('id'));let JOB=null;function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){if(!id){location.href='careers.html';return}const {data,error}=await client.from('vacancies').select('*').eq('id',id).maybeSingle();if(error||!data){document.getElementById('job').innerHTML='<div class="p-6 bg-red-50">This vacancy is not available for applications.</div>';document.getElementById('form').classList.add('hidden');return}JOB=data;document.title=`Apply: ${data.title} | TNR HR`;document.getElementById('job').innerHTML=`<span class="text-xs uppercase tracking-[.2em] text-black/45">Applying for</span><h1 class="text-3xl text-black mt-2">${e(data.title)}</h1><p class="text-sm mt-3">${e(data.location)}${data.closing_date?' · closes '+e(data.closing_date):''}</p>`}
const form=document.getElementById('form'),btn=document.getElementById('submit'),msg=document.getElementById('msg');form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Submitting...';msg.classList.add('hidden');const fd=new FormData(form);fd.append('vacancy_id',String(id));try{const r=await fetch(END,{method:'POST',headers:{apikey:KEY},body:fd});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Application failed.');form.innerHTML=`<div class="text-center py-8"><div class="w-14 h-14 bg-green-100 text-green-700 rounded-full mx-auto flex items-center justify-center"><i class="ri-check-line text-2xl"></i></div><h2 class="text-2xl text-black mt-4">Application Received</h2><p class="text-sm mt-3">Thank you. Your application reference is <strong>#${d.applicationId}</strong>.</p><a href="careers.html" class="inline-block mt-6 border px-6 py-3 text-xs uppercase tracking-wider">Back to Careers</a></div>`}catch(x){msg.textContent=x.message;msg.className='p-3 text-sm bg-red-50 text-red-700';btn.disabled=false;btn.textContent='Submit Application'}};load();
</script></body></html>
