<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard | TNR HR Business Solutions</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css">
<style>
body{background:#f5f2eb}.card{background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06)}.field{width:100%;background:white;border:1px solid rgba(0,0,0,.12);padding:.75rem 1rem;font-size:.875rem;outline:none}.field:focus{border-color:rgba(0,0,0,.45)}.label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.45rem;color:#555}.btn{padding:.72rem 1rem;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase}.btn-dark{background:#111827;color:white}.btn-line{border:1px solid #c8c5be}.badge{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.25rem .5rem;border-radius:999px}.tab.active{background:#111827;color:white}.modal{background:rgba(0,0,0,.45)}.toast{animation:slideIn .2s ease}@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}@media(max-width:700px){.desktop-table{display:none}.mobile-cards{display:block}}@media(min-width:701px){.desktop-table{display:block}.mobile-cards{display:none}}
</style>
</head>
<body>
<div id="loading" class="min-h-screen flex items-center justify-center"><div class="text-center"><i class="ri-loader-4-line animate-spin text-3xl"></i><p class="text-sm mt-3">Loading admin system...</p></div></div>
<div id="app" class="hidden min-h-screen">
<header class="bg-[#080b10] text-white sticky top-0 z-40"><div class="max-w-[1500px] mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4"><div class="flex items-center gap-4"><img src="https://storage.readdy-site.link/project_files/dfa9ab34-723c-4faf-958f-62921ec1b24e/14e8aa28-81b4-4c25-9661-837e119dd1ba_compressed_TNR_Logo_FullColour_Transparent.webp" class="h-10 w-auto brightness-0 invert" alt="TNR"><div><div class="text-[.65rem] tracking-[.18em] uppercase">Admin Platform</div><div id="userLine" class="text-xs text-white/50 mt-1"></div></div></div><div class="flex items-center gap-2"><button id="notifBtn" class="relative w-10 h-10 flex items-center justify-center hover:bg-white/10"><i class="ri-notification-3-line"></i><span id="notifCount" class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-[10px] min-w-5 h-5 px-1 rounded-full items-center justify-center"></span></button><a href="index.html" class="btn hidden sm:block">View Site</a><button onclick="logout()" class="btn">Logout</button></div></div></header>
<div id="notifPanel" class="hidden fixed right-3 top-16 z-50 w-[min(92vw,420px)] card shadow-2xl max-h-[70vh] overflow-auto"><div class="p-4 border-b flex justify-between"><strong class="text-sm">Notifications</strong><button onclick="markAllNotifications()" class="text-xs">Mark all read</button></div><div id="notifList"></div></div>
<nav class="sticky top-[72px] z-30 bg-[#f5f2eb]/95 backdrop-blur border-b"><div id="tabs" class="max-w-[1500px] mx-auto px-3 py-2 flex gap-2 overflow-x-auto"></div></nav>
<main class="max-w-[1500px] mx-auto px-4 md:px-8 py-8"><div id="panel"></div></main>
</div>
<div id="toastWrap" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] space-y-2 w-[min(92vw,440px)]"></div>
<div id="modal" class="hidden fixed inset-0 z-[80] modal items-start justify-center p-4 overflow-y-auto"><div id="modalBody" class="bg-[#faf8f2] w-full max-w-3xl mt-6 mb-10 shadow-2xl"></div></div>
<script>
const API='https://eugqokfxwucusniamxvm.supabase.co/functions/v1/admin-content', AUTH='https://eugqokfxwucusniamxvm.supabase.co/functions/v1/admin-auth', UPLOAD='https://eugqokfxwucusniamxvm.supabase.co/functions/v1/upload-image';
const TOKEN_KEY='tnr_admin_token', EXPIRES_KEY='tnr_admin_expires', USER_KEY='tnr_admin_user';
let S={user:null,permissions:{},vacancies:[],applications:[],news:[],subscribers:[],messages:[],registrations:[],notifications:[],activity:[],admins:[],tab:'overview'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fmt(v){if(!v)return '—';return new Date(v).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'});} function today(){return new Date().toISOString().slice(0,10)}
function toast(msg,type='ok'){const el=document.createElement('div');el.className='toast px-4 py-3 shadow-xl text-sm '+(type==='error'?'bg-red-700 text-white':'bg-[#111827] text-white');el.textContent=msg;document.getElementById('toastWrap').appendChild(el);setTimeout(()=>el.remove(),3500)}
function token(){return localStorage.getItem(TOKEN_KEY)||''} function isExpired(){return Date.now()>=Number(localStorage.getItem(EXPIRES_KEY)||0)}
async function request(action,payload={}){if(!token()||isExpired()){await logout(true);throw new Error('Session expired.');}const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,adminToken:token(),...payload})});let d={};try{d=await r.json()}catch{}if(r.status===401){await logout(true);throw new Error(d.message||'Session expired.')}if(!r.ok||!d.success)throw new Error(d.message||'Request failed.');return d}
async function logout(silent=false){try{if(token())await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout',token:token()})})}catch{}localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(EXPIRES_KEY);localStorage.removeItem(USER_KEY);if(!silent)location.href='login.html';else location.href='login.html'}
async function load(){if(!token()||isExpired()){location.href='login.html';return}try{const d=await request('dashboard_data');Object.assign(S,d);S.user=d.user;localStorage.setItem(USER_KEY,JSON.stringify(d.user||{}));document.getElementById('userLine').textContent=(d.user.display_name||d.user.username)+' · '+d.user.role.replace('_',' ');document.getElementById('loading').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buildTabs();render();renderNotifications();}catch(e){toast(e.message,'error')}}
function buildTabs(){const items=[['overview','Overview','ri-dashboard-line'],['applications','Applications','ri-file-user-line'],['vacancies','Vacancies','ri-briefcase-line'],['news','News','ri-article-line'],['subscribers','Subscribers','ri-mail-line'],['messages','Messages','ri-chat-3-line'],['registrations','Registrations','ri-user-add-line'],['admins','Admins','ri-shield-user-line'],['activity','Activity','ri-history-line']];const allowed=x=>x==='overview'||(x==='applications'&&S.permissions.applications)||(x==='vacancies'&&S.permissions.vacancies)||(x==='news'&&S.permissions.news)||(['subscribers','messages','registrations'].includes(x)&&['super_admin','hr_manager'].includes(S.user.role))||(['admins','activity'].includes(x)&&S.user.role==='super_admin');document.getElementById('tabs').innerHTML=items.filter(i=>allowed(i[0])).map(i=>`<button class="tab btn whitespace-nowrap ${S.tab===i[0]?'active':''}" onclick="switchTab('${i[0]}')"><i class="${i[2]} mr-1"></i>${i[1]}</button>`).join('')}
function switchTab(t){S.tab=t;buildTabs();render()}
function stat(label,value,icon,sub=''){return `<div class="card p-5"><div class="flex justify-between items-start"><div><div class="text-[.62rem] tracking-[.13em] uppercase text-black/50">${label}</div><div class="text-3xl mt-2 text-black">${value}</div>${sub?`<div class="text-xs text-black/45 mt-1">${sub}</div>`:''}</div><i class="${icon} text-xl text-black/35"></i></div></div>`}
function render(){const p=document.getElementById('panel');({overview:renderOverview,applications:renderApplications,vacancies:renderVacancies,news:renderNews,subscribers:renderSubscribers,messages:renderMessages,registrations:renderRegistrations,admins:renderAdmins,activity:renderActivity}[S.tab]||renderOverview)(p)}
function renderOverview(p){const activeVac=S.vacancies.filter(v=>!v.archived&&v.status==='published'&&(!v.closing_date||v.closing_date>=today()));const newApps=S.applications.filter(a=>a.status==='new');const published=S.news.filter(a=>!a.archived&&(a.status==='published'||(a.status==='scheduled'&&a.publish_at&&new Date(a.publish_at)<=new Date())));const unread=S.notifications.filter(n=>!n.is_read);const closing=S.vacancies.filter(v=>!v.archived&&v.closing_date&&v.closing_date>=today()&&((new Date(v.closing_date)-new Date())/86400000)<=7);const statusCounts=['new','reviewed','shortlisted','interview','rejected','hired'].map(x=>[x,S.applications.filter(a=>a.status===x).length]);const max=Math.max(1,...statusCounts.map(x=>x[1]));p.innerHTML=`<div class="flex flex-wrap justify-between gap-3 mb-6"><div><h1 class="text-2xl text-black">Dashboard</h1><p class="text-sm text-black/50 mt-1">Live operational view</p></div><button onclick="reload()" class="btn btn-line"><i class="ri-refresh-line mr-1"></i>Refresh</button></div><div class="grid grid-cols-2 lg:grid-cols-5 gap-3">${stat('Active Jobs',activeVac.length,'ri-briefcase-line')}${stat('New Applications',newApps.length,'ri-file-user-line')}${stat('Published News',published.length,'ri-article-line')}${stat('Subscribers',S.subscribers.length,'ri-mail-line')}${stat('Unread Alerts',unread.length,'ri-notification-line')}</div><div class="grid lg:grid-cols-2 gap-5 mt-6"><div class="card p-5"><h2 class="text-lg text-black mb-4">Application Pipeline</h2>${statusCounts.map(([s,n])=>`<div class="mb-3"><div class="flex justify-between text-xs mb-1 capitalize"><span>${s}</span><span>${n}</span></div><div class="h-2 bg-black/5"><div class="h-2 bg-[#111827]" style="width:${(n/max)*100}%"></div></div></div>`).join('')||'<p class="text-sm">No applications yet.</p>'}</div><div class="card p-5"><h2 class="text-lg text-black mb-4">Needs Attention</h2>${closing.length?closing.map(v=>`<div class="py-3 border-b last:border-0"><div class="font-medium text-sm">${esc(v.title)}</div><div class="text-xs text-black/50">Closes ${esc(v.closing_date)}</div></div>`).join(''):'<p class="text-sm text-black/50">No vacancies closing in the next 7 days.</p>'}</div></div>`}
async function reload(){try{const d=await request('dashboard_data');Object.assign(S,d);render();renderNotifications();toast('Dashboard refreshed.')}catch(e){toast(e.message,'error')}}
function searchBox(id,placeholder){return `<input id="${id}" oninput="render()" class="field max-w-md" placeholder="${placeholder}">`}
function renderApplications(p){let q=(document.getElementById('appSearch')?.value||'').toLowerCase(),f=document.getElementById('appFilter')?.value||'all';let rows=S.applications.filter(a=>(f==='all'||a.status===f)&&(!q||[a.full_name,a.email,a.vacancy_title,a.phone].join(' ').toLowerCase().includes(q)));p.innerHTML=`<div class="flex flex-wrap gap-3 justify-between items-end mb-5"><div><h1 class="text-2xl text-black">Applications</h1><p class="text-sm text-black/50">Applicant tracking system</p></div><div class="flex gap-2 flex-wrap"><input id="appSearch" value="${esc(q)}" oninput="renderApplications(document.getElementById('panel'))" class="field w-60" placeholder="Search applicant..."><select id="appFilter" onchange="renderApplications(document.getElementById('panel'))" class="field w-44"><option value="all">All stages</option>${['new','reviewed','shortlisted','interview','rejected','hired'].map(x=>`<option ${f===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card overflow-auto"><table class="w-full min-w-[900px] text-sm"><thead><tr class="text-left text-[.6rem] uppercase tracking-wider border-b"><th class="p-4">Candidate</th><th>Vacancy</th><th>Contact</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>${rows.map(a=>`<tr class="border-b"><td class="p-4"><strong>${esc(a.full_name)}</strong>${a.notes?`<div class="text-xs text-black/45 mt-1">${esc(a.notes).slice(0,70)}</div>`:''}</td><td>${esc(a.vacancy_title)}</td><td>${esc(a.email)}<div class="text-xs">${esc(a.phone||'')}</div></td><td><select class="field !py-2 w-36" onchange="setApplicationStatus(${a.id},this.value)">${['new','reviewed','shortlisted','interview','rejected','hired'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${fmt(a.created_at)}</td><td class="space-x-1"><button onclick="openApplication(${a.id})" class="btn btn-line">Details</button>${a.cv_path?`<button onclick="openCV(${a.id})" class="btn btn-line">CV</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="p-10 text-center text-black/50">No matching applications.</td></tr>`}</tbody></table></div>`}
async function setApplicationStatus(id,status){try{await request('application_update',{id,status});const a=S.applications.find(x=>x.id===id);if(a)a.status=status;toast('Application status updated.');}catch(e){toast(e.message,'error');reload()}}
function openApplication(id){const a=S.applications.find(x=>x.id===id);if(!a)return;openModal(`<div class="p-6 md:p-8"><div class="flex justify-between"><h2 class="text-xl text-black">${esc(a.full_name)}</h2><button onclick="closeModal()"><i class="ri-close-line text-xl"></i></button></div><div class="grid sm:grid-cols-2 gap-4 mt-6 text-sm"><div><span class="label">Vacancy</span>${esc(a.vacancy_title)}</div><div><span class="label">Applied</span>${fmt(a.created_at)}</div><div><span class="label">Email</span>${esc(a.email)}</div><div><span class="label">Phone</span>${esc(a.phone||'—')}</div></div><div class="mt-5"><span class="label">Cover Letter</span><div class="bg-white p-4 whitespace-pre-wrap text-sm">${esc(a.cover_letter||'No cover letter provided.')}</div></div><div class="mt-5"><label class="label">Recruiter Notes</label><textarea id="appNotes" class="field" rows="5">${esc(a.notes||'')}</textarea></div><div class="mt-5 flex gap-2"><button class="btn btn-dark" onclick="saveApplicationNotes(${a.id})">Save Notes</button>${a.cv_path?`<button class="btn btn-line" onclick="openCV(${a.id})">Open CV</button>`:''}</div></div>`)}
async function saveApplicationNotes(id){try{await request('application_update',{id,notes:document.getElementById('appNotes').value});await reload();closeModal();toast('Notes saved.')}catch(e){toast(e.message,'error')}} async function openCV(id){try{const d=await request('application_cv_url',{id});window.open(d.url,'_blank','noopener')}catch(e){toast(e.message,'error')}}
function renderVacancies(p){let q=(document.getElementById('vacSearch')?.value||'').toLowerCase(),f=document.getElementById('vacFilter')?.value||'all';let rows=S.vacancies.filter(v=>(f==='all'||(f==='archived'?v.archived:v.status===f))&&(!q||[v.title,v.location,v.organisation,v.description].join(' ').toLowerCase().includes(q)));p.innerHTML=`<div class="flex flex-wrap gap-3 justify-between items-end mb-5"><div><h1 class="text-2xl text-black">Vacancies</h1><p class="text-sm text-black/50">Draft, publish, close or archive jobs</p></div><button onclick="editVacancy()" class="btn btn-dark"><i class="ri-add-line mr-1"></i>New Vacancy</button></div><div class="flex gap-2 flex-wrap mb-4"><input id="vacSearch" value="${esc(q)}" oninput="renderVacancies(document.getElementById('panel'))" class="field w-64" placeholder="Search jobs..."><select id="vacFilter" onchange="renderVacancies(document.getElementById('panel'))" class="field w-44"><option value="all">All</option>${['draft','published','closed','expired'].map(x=>`<option ${f===x?'selected':''}>${x}</option>`).join('')}<option value="archived" ${f==='archived'?'selected':''}>archived</option></select></div><div class="grid gap-3">${rows.map(v=>`<div class="card p-5 flex flex-col md:flex-row md:items-center gap-4"><div class="flex-1"><div class="flex gap-2 flex-wrap items-center"><h3 class="text-lg text-black">${esc(v.title)}</h3><span class="badge bg-black/5">${esc((v.closing_date&&v.closing_date<today()&&v.status==='published')?'expired':v.status)}</span>${v.archived?'<span class="badge bg-red-100 text-red-700">archived</span>':''}</div><div class="text-xs text-black/50 mt-2">${esc(v.location)} · ${esc(v.type_label||v.type)}${v.closing_date?' · closes '+esc(v.closing_date):''}</div><p class="text-sm mt-2">${esc(v.description).slice(0,180)}${v.description?.length>180?'…':''}</p></div><div class="flex gap-2 flex-wrap"><button class="btn btn-line" onclick="editVacancy(${v.id})">Edit</button>${!v.archived?`<button class="btn btn-line" onclick="archiveVacancy(${v.id})">Archive</button>`:''}${S.user.role==='super_admin'?`<button class="btn text-red-700" onclick="deleteVacancy(${v.id})">Delete</button>`:''}</div></div>`).join('')||'<div class="card p-10 text-center">No vacancies found.</div>'}</div>`}
function editVacancy(id){const v=id?S.vacancies.find(x=>x.id===id):{};openModal(`<div class="p-6 md:p-8"><div class="flex justify-between"><div><h2 class="text-xl text-black">${id?'Edit':'New'} Vacancy</h2><p class="text-xs text-black/50 mt-1">Published jobs appear live when dates allow.</p></div><button onclick="closeModal()"><i class="ri-close-line text-xl"></i></button></div><div class="grid md:grid-cols-2 gap-4 mt-6"><div><label class="label">Job Title *</label><input id="vTitle" class="field" value="${esc(v.title||'')}"></div><div><label class="label">Location *</label><input id="vLocation" class="field" value="${esc(v.location||'')}"></div><div><label class="label">Organisation</label><input id="vOrg" class="field" value="${esc(v.organisation||'TNR HR Business Solutions')}"></div><div><label class="label">Type</label><select id="vType" class="field"><option value="contract" ${v.type==='contract'?'selected':''}>Contract</option><option value="permanent" ${v.type==='permanent'?'selected':''}>Permanent</option></select></div><div><label class="label">Type Label</label><input id="vLabel" class="field" value="${esc(v.type_label||'')}"></div><div><label class="label">Duration</label><input id="vDuration" class="field" value="${esc(v.duration||'')}"></div><div><label class="label">Positions</label><input id="vPositions" class="field" value="${esc(v.positions||'')}"></div><div><label class="label">Status</label><select id="vStatus" class="field">${['draft','published','closed'].map(x=>`<option ${v.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Opening Date</label><input id="vOpen" type="date" class="field" value="${esc(v.opening_date||'')}"></div><div><label class="label">Closing Date</label><input id="vClose" type="date" class="field" value="${esc(v.closing_date||'')}"></div></div><div class="mt-4"><label class="label">Description *</label><textarea id="vDesc" class="field" rows="5">${esc(v.description||'')}</textarea></div><label class="mt-4 flex gap-2 items-center text-sm"><input id="vNotify" type="checkbox"> Email job-alert subscribers when published</label><div class="mt-6 flex gap-2"><button id="vSave" class="btn btn-dark" onclick="saveVacancy(${id||'null'})">${id?'Save Changes':'Create Vacancy'}</button><button class="btn btn-line" onclick="closeModal()">Cancel</button></div></div>`)}
async function saveVacancy(id){const btn=document.getElementById('vSave');btn.disabled=true;btn.textContent='Saving...';const v={title:val('vTitle'),location:val('vLocation'),organisation:val('vOrg'),type:val('vType'),type_label:val('vLabel'),duration:val('vDuration'),positions:val('vPositions')||null,status:val('vStatus'),opening_date:val('vOpen')||null,closing_date:val('vClose')||null,description:val('vDesc')};try{await request(id?'vacancy_update':'vacancy_create',{id,vacancy:v,notifySubscribers:document.getElementById('vNotify').checked});closeModal();await reload();toast(id?'Vacancy updated.':'Vacancy created.')}catch(e){toast(e.message,'error');btn.disabled=false;btn.textContent=id?'Save Changes':'Create Vacancy'}}
async function archiveVacancy(id){if(!confirm('Archive this vacancy? It will disappear from the public careers page but remain in your records.'))return;try{await request('vacancy_archive',{id});await reload();toast('Vacancy archived.')}catch(e){toast(e.message,'error')}} async function deleteVacancy(id){if(!confirm('Permanently delete this vacancy? This cannot be undone.'))return;try{await request('vacancy_delete',{id});await reload();toast('Vacancy deleted.')}catch(e){toast(e.message,'error')}}
function renderNews(p){let q=(document.getElementById('newsSearch')?.value||'').toLowerCase(),f=document.getElementById('newsFilter')?.value||'all';let rows=S.news.filter(a=>(f==='all'||(f==='archived'?a.archived:a.status===f))&&(!q||[a.title,a.category,a.author,a.excerpt].join(' ').toLowerCase().includes(q)));p.innerHTML=`<div class="flex flex-wrap justify-between gap-3 mb-5"><div><h1 class="text-2xl text-black">News Manager</h1><p class="text-sm text-black/50">Draft, schedule, preview and publish articles</p></div><button class="btn btn-dark" onclick="editArticle()"><i class="ri-add-line mr-1"></i>New Article</button></div><div class="flex gap-2 flex-wrap mb-4"><input id="newsSearch" value="${esc(q)}" oninput="renderNews(document.getElementById('panel'))" class="field w-64" placeholder="Search articles..."><select id="newsFilter" onchange="renderNews(document.getElementById('panel'))" class="field w-44"><option value="all">All</option>${['draft','scheduled','published'].map(x=>`<option ${f===x?'selected':''}>${x}</option>`).join('')}<option value="archived" ${f==='archived'?'selected':''}>archived</option></select></div><div class="grid gap-3">${rows.map(a=>`<div class="card p-5 flex gap-4"><div class="w-24 h-20 bg-black/5 flex-shrink-0 overflow-hidden">${a.image_url?`<img src="${esc(a.image_url)}" class="w-full h-full object-cover">`:''}</div><div class="flex-1"><div class="flex gap-2 flex-wrap"><h3 class="text-lg text-black">${esc(a.title)}</h3><span class="badge bg-black/5">${esc(a.status)}</span>${a.archived?'<span class="badge bg-red-100 text-red-700">archived</span>':''}</div><div class="text-xs text-black/50 mt-1">${esc(a.category)} · ${esc(a.author)}${a.publish_at?' · '+fmt(a.publish_at):''}</div><p class="text-sm mt-2">${esc(a.excerpt).slice(0,160)}</p></div><div class="flex gap-2 flex-wrap items-start"><button class="btn btn-line" onclick="previewArticle('${esc(a.id)}')">Preview</button><button class="btn btn-line" onclick="editArticle('${esc(a.id)}')">Edit</button>${!a.archived?`<button class="btn btn-line" onclick="archiveArticle('${esc(a.id)}')">Archive</button>`:''}${S.user.role==='super_admin'?`<button class="btn text-red-700" onclick="deleteArticle('${esc(a.id)}')">Delete</button>`:''}</div></div>`).join('')||'<div class="card p-10 text-center">No articles found.</div>'}</div>`}
function editArticle(id){const a=id?S.news.find(x=>x.id===id):{};openModal(`<div class="p-6 md:p-8"><div class="flex justify-between"><div><h2 class="text-xl text-black">${id?'Edit':'New'} Article</h2><p class="text-xs text-black/50 mt-1">Use Scheduled + date/time to publish automatically.</p></div><button onclick="closeModal()"><i class="ri-close-line text-xl"></i></button></div><div class="grid md:grid-cols-2 gap-4 mt-6"><div class="md:col-span-2"><label class="label">Title *</label><input id="nTitle" class="field" value="${esc(a.title||'')}"></div><div><label class="label">Category</label><input id="nCategory" class="field" value="${esc(a.category||'General')}"></div><div><label class="label">Author</label><input id="nAuthor" class="field" value="${esc(a.author||'TNR HR Team')}"></div><div><label class="label">Status</label><select id="nStatus" class="field">${['draft','scheduled','published'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Publish At</label><input id="nPublish" type="datetime-local" class="field" value="${a.publish_at?new Date(a.publish_at).toISOString().slice(0,16):''}"></div><div class="md:col-span-2"><label class="label">Excerpt *</label><textarea id="nExcerpt" class="field" rows="3">${esc(a.excerpt||'')}</textarea></div><div class="md:col-span-2"><label class="label">Content *</label><textarea id="nContent" class="field" rows="9">${esc(a.content||'')}</textarea></div><div><label class="label">Image URL</label><input id="nImage" class="field" value="${esc(a.image_url||'')}"></div><div><label class="label">Upload Image</label><input id="nFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="field"></div><div class="md:col-span-2"><label class="label">Slug</label><input id="nSlug" class="field" value="${esc(a.slug||'')}"></div><div><label class="label">SEO Title</label><input id="nMetaTitle" class="field" value="${esc(a.meta_title||a.title||'')}"></div><div><label class="label">SEO Description</label><input id="nMetaDesc" class="field" value="${esc(a.meta_description||a.excerpt||'')}"></div></div><label class="mt-4 flex gap-2 items-center text-sm"><input id="nNotify" type="checkbox"> Email newsletter subscribers when publishing</label><div id="imagePreview" class="mt-4 ${a.image_url?'':'hidden'}"><img src="${esc(a.image_url||'')}" class="max-h-48"><button type="button" class="btn btn-line mt-2" onclick="document.getElementById('nImage').value='';document.getElementById('nFile').value='';document.getElementById('imagePreview').classList.add('hidden')">Remove Image</button></div><div class="mt-6 flex gap-2"><button id="nSave" class="btn btn-dark" onclick="saveArticle('${id||''}')">${id?'Save Changes':'Create Article'}</button><button class="btn btn-line" onclick="closeModal()">Cancel</button></div></div>`);document.getElementById('nFile').onchange=function(){if(this.files[0]){const u=URL.createObjectURL(this.files[0]);document.getElementById('imagePreview').classList.remove('hidden');document.querySelector('#imagePreview img').src=u;}}}
async function uploadImage(file){const fd=new FormData();fd.append('file',file);fd.append('adminToken',token());const r=await fetch(UPLOAD,{method:'POST',body:fd});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Image upload failed.');return d.url}
async function saveArticle(id){const btn=document.getElementById('nSave');btn.disabled=true;btn.textContent='Saving...';try{let image=val('nImage')||null;const f=document.getElementById('nFile').files[0];if(f)image=await uploadImage(f);let pub=val('nPublish');const a={title:val('nTitle'),category:val('nCategory'),author:val('nAuthor'),status:val('nStatus'),publish_at:pub?new Date(pub).toISOString():null,excerpt:val('nExcerpt'),content:val('nContent'),image_url:image,slug:val('nSlug')||undefined,meta_title:val('nMetaTitle'),meta_description:val('nMetaDesc')};await request(id?'article_update':'article_create',{id,article:a,notifySubscribers:document.getElementById('nNotify').checked});closeModal();await reload();toast(id?'Article updated.':'Article created.')}catch(e){toast(e.message,'error');btn.disabled=false;btn.textContent=id?'Save Changes':'Create Article'}}

function previewArticle(id){const a=S.news.find(x=>x.id===id);if(!a)return;openModal(`<div class="p-6 md:p-10"><div class="flex justify-between gap-3"><div><div class="text-xs uppercase tracking-wider text-black/45">${esc(a.category)} · ${esc(a.status)}</div><h2 class="text-3xl text-black mt-2">${esc(a.title)}</h2></div><button onclick="closeModal()"><i class="ri-close-line text-xl"></i></button></div><p class="text-lg text-black/60 mt-5">${esc(a.excerpt)}</p>${a.image_url?`<img src="${esc(a.image_url)}" class="w-full max-h-[420px] object-cover mt-6">`:''}<div class="mt-7 whitespace-pre-wrap leading-8">${esc(a.content)}</div></div>`)}
async function archiveArticle(id){if(!confirm('Archive this article?'))return;try{await request('article_archive',{id});await reload();toast('Article archived.')}catch(e){toast(e.message,'error')}} async function deleteArticle(id){if(!confirm('Permanently delete this article?'))return;try{await request('article_delete',{id});await reload();toast('Article deleted.')}catch(e){toast(e.message,'error')}}
function simpleTable(rows,cols){return `<div class="card overflow-auto"><table class="w-full min-w-[700px] text-sm"><thead><tr class="text-left text-[.6rem] uppercase tracking-wider border-b">${cols.map(c=>`<th class="p-4">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-b">${cols.map(c=>`<td class="p-4">${esc(typeof c[1]==='function'?c[1](r):r[c[1]])}</td>`).join('')}</tr>`).join('')||`<tr><td class="p-8 text-center" colspan="${cols.length}">No records yet.</td></tr>`}</tbody></table></div>`}
function renderSubscribers(p){p.innerHTML=`<h1 class="text-2xl text-black mb-5">Newsletter Subscribers</h1>${simpleTable(S.subscribers,[['Name','name'],['Email','email'],['Date',r=>fmt(r.created_at)]])}`}
function renderMessages(p){p.innerHTML=`<h1 class="text-2xl text-black mb-5">Contact Messages</h1><div class="grid gap-3">${S.messages.map(m=>`<div class="card p-5"><div class="flex justify-between gap-3"><div><strong class="text-black">${esc(m.subject)}</strong><div class="text-xs text-black/50">${esc(m.name)} · ${esc(m.email)} · ${fmt(m.created_at)}</div></div></div><p class="text-sm mt-3 whitespace-pre-wrap">${esc(m.message)}</p></div>`).join('')||'<div class="card p-8">No messages yet.</div>'}</div>`}
function renderRegistrations(p){p.innerHTML=`<h1 class="text-2xl text-black mb-5">Website Registrations</h1>${simpleTable(S.registrations,[['Name','name'],['Email','email'],['Newsletter',r=>r.newsletter?'Yes':'No'],['Job Alerts',r=>r.job_alerts?'Yes':'No'],['Date',r=>fmt(r.created_at)]])}`}
function renderAdmins(p){p.innerHTML=`<div class="flex justify-between gap-3 mb-5"><div><h1 class="text-2xl text-black">Admin Accounts</h1><p class="text-sm text-black/50">Role-based access control</p></div><button class="btn btn-dark" onclick="editAdmin()">New Admin</button></div><div class="grid gap-3">${S.admins.map(a=>`<div class="card p-5 flex flex-wrap gap-3 items-center justify-between"><div><strong class="text-black">${esc(a.display_name||a.username)}</strong><div class="text-xs text-black/50">@${esc(a.username)} · ${esc(a.email||'no email')} · ${esc(a.role.replace('_',' '))}</div></div><div class="flex gap-2"><span class="badge ${a.active?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${a.active?'active':'inactive'}</span><button class="btn btn-line" onclick="editAdmin('${a.id}')">Edit</button></div></div>`).join('')}</div>`}
function editAdmin(id){const a=id?S.admins.find(x=>x.id===id):{};openModal(`<div class="p-6"><div class="flex justify-between"><h2 class="text-xl">${id?'Edit':'New'} Admin</h2><button onclick="closeModal()"><i class="ri-close-line"></i></button></div><div class="grid gap-4 mt-5"><div><label class="label">Username</label><input id="aUser" class="field" ${id?'disabled':''} value="${esc(a.username||'')}"></div><div><label class="label">Display Name</label><input id="aName" class="field" value="${esc(a.display_name||'')}"></div><div><label class="label">Email</label><input id="aEmail" type="email" class="field" value="${esc(a.email||'')}"></div><div><label class="label">Role</label><select id="aRole" class="field">${['super_admin','hr_manager','recruiter','content_editor'].map(x=>`<option value="${x}" ${a.role===x?'selected':''}>${x.replace('_',' ')}</option>`).join('')}</select></div><div><label class="label">${id?'New Password (leave blank to keep current)':'Password *'}</label><input id="aPass" type="password" class="field"></div>${id?`<label class="flex gap-2"><input id="aActive" type="checkbox" ${a.active?'checked':''}> Active</label>`:''}</div><button id="aSave" class="btn btn-dark mt-6" onclick="saveAdmin('${id||''}')">Save Admin</button></div>`)}
async function saveAdmin(id){const admin={username:val('aUser'),display_name:val('aName'),email:val('aEmail')||null,role:val('aRole'),password:val('aPass')};if(id)admin.active=document.getElementById('aActive').checked;try{await request(id?'admin_update':'admin_create',{id,admin});closeModal();await reload();toast('Admin account saved.')}catch(e){toast(e.message,'error')}}
function renderActivity(p){p.innerHTML=`<h1 class="text-2xl text-black mb-5">Admin Activity</h1><div class="card divide-y">${S.activity.map(a=>`<div class="p-4 flex gap-3 justify-between"><div><strong class="text-sm">${esc(a.action.replaceAll('_',' '))}</strong><div class="text-xs text-black/50">${esc(a.admin_users?.display_name||a.admin_users?.username||'System')} · ${esc(a.entity_type||'')} ${esc(a.entity_id||'')}</div></div><div class="text-xs text-black/45">${fmt(a.created_at)}</div></div>`).join('')||'<div class="p-8">No activity yet.</div>'}</div>`}
function renderNotifications(){const unread=S.notifications.filter(n=>!n.is_read);const c=document.getElementById('notifCount');if(unread.length){c.textContent=unread.length;c.classList.remove('hidden');c.classList.add('flex')}else{c.classList.add('hidden')}document.getElementById('notifList').innerHTML=S.notifications.slice(0,50).map(n=>`<button onclick="readNotification(${n.id})" class="w-full text-left p-4 border-b ${n.is_read?'opacity-55':'bg-white'}"><div class="text-sm font-medium">${esc(n.title)}</div><div class="text-xs text-black/55 mt-1">${esc(n.message||'')}</div><div class="text-[10px] text-black/40 mt-2">${fmt(n.created_at)}</div></button>`).join('')||'<div class="p-6 text-sm">No notifications.</div>'}
document.getElementById('notifBtn').onclick=()=>document.getElementById('notifPanel').classList.toggle('hidden');async function readNotification(id){try{await request('notification_read',{id});const n=S.notifications.find(x=>x.id===id);if(n)n.is_read=true;renderNotifications()}catch(e){toast(e.message,'error')}}async function markAllNotifications(){try{await request('notifications_read_all');S.notifications.forEach(n=>n.is_read=true);renderNotifications()}catch(e){toast(e.message,'error')}}
function openModal(html){const m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=html;m.classList.remove('hidden');m.classList.add('flex')}function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex');document.getElementById('modalBody').innerHTML=''}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});function val(id){return document.getElementById(id)?.value?.trim()||''}
load();
</script>
</body></html>
